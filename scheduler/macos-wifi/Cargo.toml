[package]
name = "shu-wifi-login"
version = "0.1.0"
edition = "2024"

# Build the worker independently, without resolving or building Tauri.
[workspace]

[dependencies]
libc = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
urlencoding = "2.1"
