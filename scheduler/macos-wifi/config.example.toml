# 必须与 macOS WiFi 菜单中的名称完全一致（大小写、括号和空格）。
ssid = "Shu(ForAll)"
username = "your_student_id"
password = "your_campus_password"

# 开放 WiFi 不需要此项。仅用于 WiFi 本身的 WPA 密码，不是校园网密码。
# wifi_password = "your_wifi_password"

attempts = 4
retry_seconds = 1
# 已关联目标 WiFi 后，允许网络恢复重试的窗口（秒）；0 禁用，省略默认 30。
recovery_seconds = 30
timeout_seconds = 10
