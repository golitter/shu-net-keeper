[package]
name = "shu-net-timer"
version = "0.1.0"
edition = "2024"

# This is intentionally independent from the GUI workspace in the repository root.
[workspace]

[dependencies]
chrono = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
